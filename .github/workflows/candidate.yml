name: candidate

on:
  workflow_call:
    inputs:
      source_repository:
        description: Owner/name contract repository
        required: true
        type: string
      source_ref:
        description: Exact contract source commit
        required: true
        type: string
      spec_artifact_name:
        description: Same-run sealed spec candidate artifact name
        required: true
        type: string
      spec_artifact_digest:
        description: Actions SHA-256 for the spec artifact
        required: true
        type: string
      spec_candidate_manifest_sha256:
        description: SHA-256 of the spec candidate-artifact.json
        required: true
        type: string
      spec_source_commit:
        description: Exact spec source commit
        required: true
        type: string
    outputs:
      artifact_name:
        value: ${{ jobs.candidate.outputs.artifact_name }}
      artifact_id:
        value: ${{ jobs.candidate.outputs.artifact_id }}
      artifact_digest:
        value: ${{ jobs.candidate.outputs.artifact_digest }}
      candidate_manifest_sha256:
        value: ${{ jobs.candidate.outputs.candidate_manifest_sha256 }}
      source_commit:
        value: ${{ jobs.candidate.outputs.source_commit }}

permissions:
  contents: read

concurrency:
  group: candidate-${{ inputs.source_repository }}-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
      artifact_id: ${{ steps.candidate-upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.candidate-upload.outputs.artifact-digest }}
      candidate_manifest_sha256: ${{ steps.seal.outputs.manifest_sha256 }}
      source_commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Check out the exact contract source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_ref }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the exact source commit
        id: source
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          case "$SOURCE_REPOSITORY" in [A-Za-z0-9_.-]*/[A-Za-z0-9_.-]*) ;; *) echo "source_repository must be owner/name" >&2; exit 1 ;; esac
          case "$SOURCE_REF" in *[!a-f0-9]*|'') echo "source_ref is invalid" >&2; exit 1 ;; esac
          test "${#SOURCE_REF}" -eq 40
          commit=$(git -C source rev-parse HEAD)
          test "$commit" = "$SOURCE_REF"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Download the exact spec candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.spec_artifact_name }}
          path: spec-candidate
      - name: Verify and extract the spec candidate
        shell: bash
        env:
          ARTIFACT_NAME: ${{ inputs.spec_artifact_name }}
          ARTIFACT_DIGEST: ${{ inputs.spec_artifact_digest }}
          MANIFEST_SHA256: ${{ inputs.spec_candidate_manifest_sha256 }}
          SOURCE_COMMIT: ${{ inputs.spec_source_commit }}
        run: |
          for digest in "$ARTIFACT_DIGEST" "$MANIFEST_SHA256"; do
            test "${#digest}" -eq 64
            case "$digest" in *[!a-f0-9]*) echo "candidate digest is invalid" >&2; exit 1 ;; esac
          done
          test "${#SOURCE_COMMIT}" -eq 40
          case "$SOURCE_COMMIT" in *[!a-f0-9]*) echo "spec source commit is invalid" >&2; exit 1 ;; esac
          test "$(sha256sum spec-candidate/candidate-artifact.json | awk '{print $1}')" = "$MANIFEST_SHA256"
          test "$(jq -r .source.commit spec-candidate/candidate-artifact.json)" = "$SOURCE_COMMIT"
          test "$(jq -r .component.id spec-candidate/candidate-artifact.json)" = "soksak-spec"
          set -- spec-candidate/soksak-ai-plugin-spec-*.tgz
          test "$#" -eq 1
          mkdir spec-package
          tar -xzf "$1" -C spec-package --strip-components=1
          test -z "$(find spec-package -type l -print -quit)"
          node spec-package/release-template/verify-candidate-artifact.mjs \
            --directory "$GITHUB_WORKSPACE/spec-candidate"
          node spec-package/release-template/write-candidate-input-receipt.mjs \
            --directory "$GITHUB_WORKSPACE/spec-candidate" \
            --artifact-name "$ARTIFACT_NAME" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --candidate-manifest-sha256 "$MANIFEST_SHA256" \
            --out "$GITHUB_WORKSPACE/spec-validation.json"
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          package_json_file: source/package.json
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: source/.node-version
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Verify the contract owner boundary
        working-directory: source
        run: make verify
      - name: Build the canonical candidate bytes
        working-directory: source
        run: >-
          node ../spec-package/release-template/build-portable-release.mjs
          --commit '${{ steps.source.outputs.commit }}'
          --out "$GITHUB_WORKSPACE/component-output"
      - name: Seal the contract candidate
        id: seal
        shell: bash
        run: |
          cp spec-validation.json component-output/spec-validation.json
          node spec-package/release-template/seal-candidate-artifact.mjs \
            --directory "$GITHUB_WORKSPACE/component-output" \
            --evidence spec-validation.json
          node spec-package/release-template/verify-candidate-artifact.mjs \
            --directory "$GITHUB_WORKSPACE/component-output"
          echo "manifest_sha256=$(sha256sum component-output/candidate-artifact.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Name the artifact from verified component identity
        id: identity
        shell: bash
        run: |
          id=$(jq -r .component.id component-output/candidate-artifact.json)
          test "$id" = "soksak-contract-plugin-terminal"
          echo "artifact_name=candidate-$id-${{ steps.source.outputs.commit }}" >> "$GITHUB_OUTPUT"
      - name: Upload the sealed contract candidate
        id: candidate-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: component-output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
